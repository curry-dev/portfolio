<div id="displayCurry" style="padding: 0;">
    <div class="container">
        <div class="container-fluid h-100" style="padding: 0;">

            <!-- heading -->
            <a href="https://curry-dev.github.io/curry-ninja/" target="_blank">
                <div class="company-box" style="padding: 50px 0;">
                    <div class="row" style="padding: 0; margin: 0;">
                        <div class="col d-flex justify-content-center">
                            <img ngSrc="assets/work-art/curryninja/profile-circle.jpg" style="height:100px; width: auto; border-radius: 50%; position: relative; border: 1px solid black;" fill priority>
                        </div>
                    </div>
                    <div class="row" style="padding: 0; margin: 0;">
                        <div class="col d-flex justify-content-center">
                            <p class="box-heading align-items-center"
                                style="font-family: 'Russo One', sans-serif; color: black; font-size: 50px; margin: 0;">Curry Ninja
                            </p>
                        </div>
                    </div>
                </div>
            </a>
            
            <!-- description -->
            <div class="box row my-3">
                <div class="col">
                    <p class="text-content mt-5">
                        I developed a website to display my art: <a href="https://curry-dev.github.io/curry-ninja/" class="project-link" target="_blank">Curry Ninja</a> (my stage name hehe). It is a simple HTML and CSS script displaying most of my
                        drawings, which is my hobby!
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- my art -->
    <div class="artbg">
        <div class="container">
            <p style="font-size: 2.5em; padding: 0; text-align: center; color: black;" class="pt-3">I drew these :D</p>
    
            <div class="row pb-5">
                <div class="fullwrap p-0 m-1" *ngFor="let image of images">
                    <img ngSrc="assets/work-art/curryninja/drawings/{{ image.path }}" (click)="openImage(image.path)" class="click-to-expand" style="height:330px; width:auto; position: relative;" fill priority>
                </div>
            </div>

            <div class="modal-backdrop" *ngIf="selectedImage" (click)="closeImage()">
                <div class="modal-content" (click)="$event.stopPropagation()">
                    <img src="assets/work-art/curryninja/drawings/{{ selectedImage }}" />
                </div>
            </div>

        </div>
    </div>
</div>
